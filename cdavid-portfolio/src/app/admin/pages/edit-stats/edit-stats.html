<div class="editor-page">
  <div class="editor-header">
    <h1>Edit Stats</h1>
    <div class="header-actions">
      <button class="btn-reset" (click)="reset()">Reset</button>
      <button class="btn-save" (click)="save()">Save Changes</button>
    </div>
  </div>

  <div class="form-section">
    <h3>Stat Items</h3>
    @for (item of data.items; track $index) {
      <div class="array-item">
        <div class="item-header">
          <span class="item-title">Stat {{ $index + 1 }}</span>
          <button class="remove-btn" (click)="removeItem($index)">Remove</button>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Icon Class</label>
            <input [(ngModel)]="item.icon" [name]="'icon' + $index" placeholder="bi bi-emoji-smile">
          </div>
          <div class="form-group">
            <label>End Value</label>
            <input type="number" [(ngModel)]="item.endValue" [name]="'val' + $index">
          </div>
        </div>
        <div class="form-group">
          <label>Label</label>
          <input [(ngModel)]="item.label" [name]="'label' + $index">
        </div>
      </div>
    }
    <button class="add-btn" (click)="addItem()"><i class="bi bi-plus"></i> Add Stat</button>
  </div>

  @if (saved()) {
    <div class="save-toast">Changes saved!</div>
  }
</div>
