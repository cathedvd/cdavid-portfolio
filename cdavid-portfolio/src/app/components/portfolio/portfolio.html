<section id="portfolio" class="portfolio section">
  <div class="container section-title">
    <h2>Portfolio</h2>
  </div>

  @if (items().length > 0) {
    <div class="container">
      <div class="row">
        <div class="col-lg-3 filter-sidebar">
          <div class="filters-wrapper">
            <ul class="portfolio-filters">
              @for (filter of filters(); track filter.filterValue) {
                <li
                  [class.filter-active]="activeFilter() === filter.filterValue"
                  (click)="setFilter(filter.filterValue)">
                  {{ filter.label }}
                </li>
              }
            </ul>
          </div>
        </div>

        <div class="col-lg-9">
          <div class="row gy-4 portfolio-container">
            @for (item of filteredItems(); track item.id) {
              <div class="col-lg-6 col-md-6 portfolio-item">
                <div class="portfolio-wrap">
                  <img [src]="item.imagePath" class="img-fluid" [alt]="item.title" loading="lazy">
                  <div class="portfolio-info">
                    <div class="content">
                      <span class="category">{{ item.category }}</span>
                      <h4>{{ item.title }}</h4>
                      <div class="portfolio-links">
                        <a [href]="item.imagePath" class="glightbox" [title]="item.title"><i class="bi bi-plus-lg"></i></a>
                        <a [routerLink]="['/portfolio-details', item.id]" title="More Details"><i class="bi bi-arrow-right"></i></a>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  }
</section>
