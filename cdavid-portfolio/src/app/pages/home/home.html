<app-header />

<main class="main">
  <app-hero />
  @if (visibility().about) { <app-about /> }
  @if (visibility().stats) { <app-stats /> }
  @if (visibility().skills) { <app-skills /> }
  @if (visibility().portfolio) { <app-portfolio /> }
  @if (visibility().services) { <app-services /> }
  @if (visibility().testimonials) { <app-testimonials /> }
  @if (visibility().contact) { <app-contact /> }
</main>

<app-footer />

<!-- Scroll Top -->
<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center" (click)="scrollToTop($event)">
  <i class="bi bi-arrow-up-short"></i>
</a>
